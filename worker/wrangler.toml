name = "telerecados-ia"
main = "src/index.ts"
compatibility_date = "2026-11-01"
compatibility_flags = ["nodejs_compat"]

[vars]
# Origens que podem chamar a IA (o navegador manda o host em minúsculas).
ORIGENS = "https://luizfernandosorato.github.io,http://localhost:5173,http://localhost:4173"

# 10 pedidos por minuto por IP
[[ratelimits]]
name = "LIMITADOR"
namespace_id = "1001"
simple = { limit = 10, period = 60 }
